<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEGIS - Iniciar Sesión</title>

    <link rel="stylesheet" href="/Inicio de Sesión/InicioSesion/InicioSesion.css">

    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">

        <!-- PANEL IZQUIERDO -->
        <div class="left-panel">

            <div class="security-wrapper">

                <div class="security-icon">

                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M7 11V8C7 5.2 9.2 3 12 3C14.8 3 17 5.2 17 8V11"
                            stroke="#1DD1A1"
                            stroke-width="1.8"
                            stroke-linecap="round"/>

                        <rect x="5" y="11" width="14" height="10" rx="2"
                            stroke="#1DD1A1"
                            stroke-width="1.8"/>
                    </svg>

                </div>

                <h1>Acceso Seguro</h1>

                <p>
                    Tu cuenta está protegida por
                    encriptaciones y múltiples sistemas de
                    seguridad y autenticacion.
                </p>

                <!-- CARD -->
                <div class="security-card">

                    <h3>Indicadores de Seguridad</h3>

                    <div class="security-item">

                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M20 6L9 17L4 12"
                                stroke="#1DD1A1"
                                stroke-width="2.4"
                                stroke-linecap="round"
                                stroke-linejoin="round"/>
                        </svg>

                        <span>256-bit SSL encriptación</span>

                    </div>

                    <div class="security-item">

                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M20 6L9 17L4 12"
                                stroke="#1DD1A1"
                                stroke-width="2.4"
                                stroke-linecap="round"
                                stroke-linejoin="round"/>
                        </svg>

                        <span>Alertas de inicio de sesión</span>

                    </div>

                    <div class="security-item">

                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M20 6L9 17L4 12"
                                stroke="#1DD1A1"
                                stroke-width="2.4"
                                stroke-linecap="round"
                                stroke-linejoin="round"/>
                        </svg>

                        <span>Monitoreo en sesión activa</span>

                    </div>

                </div>

            </div>

        </div>

        <!-- PANEL DERECHO -->
        <div class="right-panel">

            <div class="form-container">

                <a href="#" class="back-home">
                    ← Back to Home
                </a>

                <h2>Bienvenido de nuevo</h2>

                <form id="loginForm">

                    <div class="input-group">

                        <label>Correo electronico</label>

                        <input 
                            type="email"
                            id="email"
                            placeholder="Alex@gmail.com"
                            required
                        >

                    </div>

                    <div class="input-group">

                        <label>Contraseña</label>

                        <div class="password-wrapper">

                            <input 
                                type="password"
                                id="password"
                                placeholder="Contraseña"
                                required
                                minlength="6"
                            >

                            <div class="eye-icon">

                                <svg viewBox="0 0 24 24" fill="none">
                                    <path d="M2 12C2 12 5.5 6 12 6C18.5 6 22 12 22 12C22 12 18.5 18 12 18C5.5 18 2 12 2 12Z"
                                        stroke="#7B7B7B"
                                        stroke-width="1.8"/>

                                    <circle cx="12" cy="12" r="3"
                                        stroke="#7B7B7B"
                                        stroke-width="1.8"/>
                                </svg>

                            </div>

                        </div>

                    </div>

                    <!-- BOTÓN HIPERVÍNCULO -->
                    <a href="/Inicio/Home/Home.html" class="login-btn" id="loginBtn">

                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M7 11V8C7 5.2 9.2 3 12 3C14.8 3 17 5.2 17 8V11"
                                stroke="white"
                                stroke-width="2"
                                stroke-linecap="round"/>

                            <rect x="5" y="11" width="14" height="10" rx="2"
                                stroke="white"
                                stroke-width="2"/>
                        </svg>

                        Iniciar Sesión

                    </a>

                </form>

            </div>

        </div>

    </div>

    <script>

        const loginBtn = document.getElementById("loginBtn");

        loginBtn.addEventListener("click", function(event){

            const email = document.getElementById("email");
            const password = document.getElementById("password");

            if(!email.checkValidity() || !password.checkValidity()){

                event.preventDefault();

                email.reportValidity();
                password.reportValidity();
            }

        });

    </script>

</body>
</html>
