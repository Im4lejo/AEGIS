<svg xmlns="http://www.w3.org/2000/svg" width="400" height="640" viewBox="0 0 400 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd93d"/>
      <stop offset="1" stop-color="#ffb703"/>
    </linearGradient>
    <linearGradient id="rojo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef233c"/>
      <stop offset="1" stop-color="#d90429"/>
    </linearGradient>
  </defs>

  <rect width="400" height="640" fill="url(#fondo)"/>

  <!-- decoraciones -->
  <circle cx="40" cy="120" r="70" fill="#ff5400" opacity="0.25"/>
  <circle cx="370" cy="330" r="90" fill="#ef233c" opacity="0.18"/>
  <circle cx="30" cy="520" r="60" fill="#ffb703" opacity="0.5"/>
  <rect x="330" y="60" width="60" height="60" rx="12" fill="#d90429" opacity="0.3" transform="rotate(20 360 90)"/>
  <rect x="20" y="300" width="46" height="46" rx="10" fill="#ff5400" opacity="0.3" transform="rotate(-15 43 323)"/>

  <!-- cinta superior -->
  <rect x="0" y="24" width="400" height="46" fill="url(#rojo)"/>
  <text x="200" y="56" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="2">¡DÍA ESPECIAL!</text>

  <!-- título -->
  <text x="200" y="150" text-anchor="middle" font-size="54" font-weight="900" fill="#d90429">OFERTAS</text>
  <text x="200" y="205" text-anchor="middle" font-size="54" font-weight="900" fill="#d90429">INCREÍBLES</text>
  <text x="200" y="243" text-anchor="middle" font-size="24" font-weight="800" fill="#1f2937" letter-spacing="4">SOLO HOY</text>

  <!-- descuento -->
  <text x="200" y="295" text-anchor="middle" font-size="30" font-weight="800" fill="#1f2937">HASTA</text>
  <text x="200" y="360" text-anchor="middle" font-size="62" font-weight="900" fill="#d90429">-50% DTO.</text>

  <!-- categoría -->
  <line x1="60" y1="390" x2="130" y2="390" stroke="#1f2937" stroke-width="3"/>
  <line x1="270" y1="390" x2="340" y2="390" stroke="#1f2937" stroke-width="3"/>
  <text x="200" y="398" text-anchor="middle" font-size="24" font-weight="900" fill="#1f2937" letter-spacing="3">TECNOLOGÍA</text>

  <!-- detalles -->
  <text x="200" y="432" text-anchor="middle" font-size="15" font-weight="600" fill="#374151">• Artículos de Tecnología Seleccionados con -50%</text>
  <text x="200" y="458" text-anchor="middle" font-size="15" font-weight="600" fill="#374151">• Regalos Tech por Compras +$50.000</text>

  <!-- contador -->
  <rect x="70" y="486" width="260" height="46" rx="10" fill="#ffffff" stroke="#d90429" stroke-width="3"/>
  <text x="200" y="507" text-anchor="middle" font-size="14" font-weight="800" fill="#d90429">¡QUÉDAN POCAS HORAS!</text>
  <text x="200" y="525" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">3h 14m</text>

  <!-- botón -->
  <rect x="75" y="556" width="250" height="52" rx="10" fill="#1f2937"/>
  <text x="200" y="589" text-anchor="middle" font-size="19" font-weight="900" fill="#ffd93d">¡COMPRAR AHORA!</text>
</svg>
