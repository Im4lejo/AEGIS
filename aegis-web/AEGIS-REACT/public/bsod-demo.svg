<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <rect width="1200" height="675" fill="#0078D7"/>

  <text x="90" y="170" font-size="120" font-weight="600" fill="#ffffff">:(</text>

  <text x="90" y="250" font-size="30" font-weight="400" fill="#ffffff">Your PC ran into a problem and needs to run. We're just</text>
  <text x="90" y="295" font-size="30" font-weight="400" fill="#ffffff">collecting some error info, and then we'll restart for you.</text>

  <text x="90" y="385" font-size="30" font-weight="400" fill="#ffffff">37% complete</text>

  <text x="90" y="470" font-size="24" font-weight="400" fill="#ffffff">For more information about this issue and possible fixes, visit</text>
  <text x="90" y="505" font-size="24" font-weight="400" fill="#ffffff">https://www.windows.com/stopcode</text>

  <text x="90" y="575" font-size="24" font-weight="400" fill="#ffffff">If you call a support person, give them this info:</text>
  <text x="90" y="612" font-size="24" font-weight="700" fill="#ffffff">Stop code: CRITICAL_PROCESS_DIED</text>
</svg>
